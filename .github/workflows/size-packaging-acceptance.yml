name: Size campaign packaging acceptance
run-name: Published archive smoke ${{ inputs.release_tag }} @ ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published beta tag
        required: true
        type: string
      source_sha:
        description: Full lowercase source commit recorded by the release
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-archive:
    name: Native published archive acceptance (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: windows-latest
            rid: win-x64
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_RID: ${{ matrix.rid }}
    steps:
      - name: Validate release coordinates
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out the verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: verification

      - name: Check out the published acceptance script by tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false
          path: release-source

      - name: Download the public release without credentials and verify each executed byte
        shell: bash
        run: |
          test "$(git -C release-source rev-parse HEAD)" = "$SOURCE_SHA"
          python3 verification/tools/ci/check-published-archive-bytes.py

      - name: Execute the native release CLI and MCP archives
        shell: bash
        env:
          RATELDESK_ARCHIVE_PTY_ACCEPTANCE: ${{ startsWith(matrix.rid, 'linux-') && 'true' || 'false' }}
        run: |
          set -o pipefail
          cd release-source
          tools/release/test-executable-archives.sh ../release-assets "$RELEASE_RID" --validate-docs 2>&1 | tee ../native.log

      - name: Verify the public deployment bundle and Compose recipes
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -o pipefail
          cd release-source
          tools/ci/test-deployment-archive-compose-config.sh "../release-assets/rateldesk-deployment-${RELEASE_TAG#v}.tar.gz" 2>&1 | tee ../deployment.log

      - name: Retain native receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-${{ inputs.release_tag }}-${{ matrix.rid }}
          path: |
            verified-bytes.json
            native.log
            deployment.log
          if-no-files-found: warn
          retention-days: 30
