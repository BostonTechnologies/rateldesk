name: Native Graph mail payload acceptance

on:
  push:
    branches: ['campaign/rd-size-graph-mail', 'campaign/rd-size-graph-mail-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graph-mail-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Graph API image and providers (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {architecture: amd64, runner: ubuntu-24.04}
          - {architecture: arm64, runner: ubuntu-24.04-arm}
    steps:
      - name: Check out exact source and immutable full-SDK control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up native test SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.403'
      - name: Set up native Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify inventory and OCI failure boundaries
        run: |
          python3 -m unittest discover -s tools/size-campaign -p 'test_api_rid_acceptance.py' -v
          python3 -m unittest discover -s tools/size-campaign -p 'test_graph_mail_acceptance.py' -v
      - name: Reproduce pinned generated source
        if: matrix.architecture == 'amd64'
        run: python3 tools/size-campaign/generate-graph-mail.py --work-directory "$RUNNER_TEMP/graph-generation" --check
      - name: Check unchanged Slopwatch baseline
        run: |
          dotnet tool restore
          dotnet tool run slopwatch analyze --fail-on warning
      - name: Compare complete images and exercise native mail and database paths
        run: >-
          python3 tools/size-campaign/graph-mail-acceptance.py
          --architecture '${{ matrix.architecture }}'
          --output "$RUNNER_TEMP/rd-graph-${{ matrix.architecture }}"
      - name: Retain measurements, identities, fixtures and runtime outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rd-graph-mail-${{ matrix.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rd-graph-${{ matrix.architecture }}/evidence
          if-no-files-found: error
          retention-days: 30
