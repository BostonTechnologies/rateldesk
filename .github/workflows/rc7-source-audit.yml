name: rc.7 source audit

on:
  push:
    branches: [fix/rc7-remove-legacy-ai]
    paths: [.github/workflows/rc7-source-audit.yml]

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_INSTALL_DIR: /tmp/rateldesk-rc7/sdk
      NUGET_PACKAGES: /tmp/rateldesk-rc7/packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Restore public build inputs
        run: |
          dotnet restore Helpdesk.sln
          tar -czf - -C /tmp/rateldesk-rc7 sdk packages | split -b 350M -d - "$RUNNER_TEMP/build-inputs.part"
          git ls-files '*AGENTS.md' '*SKILL.md'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc7-inputs-00
          path: ${{ runner.temp }}/build-inputs.part00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc7-inputs-01
          path: ${{ runner.temp }}/build-inputs.part01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc7-inputs-02
          path: ${{ runner.temp }}/build-inputs.part02
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc7-inputs-03
          path: ${{ runner.temp }}/build-inputs.part03
          compression-level: 0
          retention-days: 1
