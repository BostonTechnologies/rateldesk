name: Release

on:
  push:
    tags:
      - 'v*'
      - 'RatelDesk-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag to validate and stage
        required: true
        type: string
      source_revision:
        description: Optional full current main SHA; create an unallocated beta or RC tag after exact-source CI passes
        required: false
        default: ''
        type: string

concurrency:
  # Serialize both accepted tag prefixes and different versions through allocation/publication.
  group: rateldesk-release
  cancel-in-progress: false

jobs:
  prepare-tag:
    name: Create verified prerelease tag when requested
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_revision != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require the selected current main revision
        shell: bash
        env:
          RELEASE_SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$RELEASE_SOURCE_REVISION" = "$GITHUB_SHA"
          [[ "$RELEASE_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out the reviewed main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Verify main CI and unused version, then create the immutable tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE_REVISION: ${{ inputs.source_revision }}
        run: python3 tools/release/create-prerelease-tag.py

  metadata:
    name: Validate release metadata
    needs: prepare-tag
    if: ${{ !cancelled() && (needs.prepare-tag.result == 'success' || needs.prepare-tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      source_revision: ${{ steps.release.outputs.source_revision }}
      build_timestamp: ${{ steps.release.outputs.build_timestamp }}
    steps:
      - name: Check out release tag and main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - id: release
        name: Check tag, evaluated version, and main ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          git fetch origin main
          release_metadata="$(git show origin/main:tools/release/validate-release-version.sh | bash -s -- "$tag")"
          version="$(awk -F= '/^version=/{print $2}' <<<"$release_metadata")"
          prerelease="$(awk -F= '/^prerelease=/{print $2}' <<<"$release_metadata")"
          evaluated_version="$(dotnet msbuild src/Helpdesk.API/Helpdesk.API.csproj -nologo -getProperty:Version | tr -d '\r\n')"
          if [[ "$version" != "$evaluated_version" ]]; then
            echo "Tag version '$version' does not match evaluated repository version '$evaluated_version'." >&2
            exit 1
          fi

          source_revision="$(git rev-list -n 1 "$tag")"
          test -n "$source_revision"
          git merge-base --is-ancestor "$source_revision" origin/main

          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "source_revision=$source_revision"
            echo "build_timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse rebuilding an allocated immutable image version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: python3 tools/release/create-prerelease-tag.py check-images

  validation:
    name: Release validation
    needs: metadata
    if: ${{ !cancelled() && needs.metadata.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install repository validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Run public disclosure gate
        run: tools/ci/check-public-disclosure.sh

      - name: Restore, build, and test
        run: |
          dotnet restore Helpdesk.sln
          dotnet build Helpdesk.sln --configuration Release --no-restore
          dotnet test Helpdesk.sln --configuration Release --no-build

      - name: Validate repository layout
        run: tools/ci/validate-layout.sh

      - name: Build release-equivalent containers
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_REVISION_ID: ${{ needs.metadata.outputs.source_revision }}
          BUILD_TIMESTAMP: ${{ needs.metadata.outputs.build_timestamp }}
        run: |
          docker build --file docker/api/Dockerfile --tag rateldesk-api:release-validation \
            --build-arg VERSION --build-arg SOURCE_REVISION_ID --build-arg BUILD_TIMESTAMP .
          docker build --file docker/web/Dockerfile --tag rateldesk-web:release-validation \
            --build-arg VERSION --build-arg SOURCE_REVISION_ID --build-arg BUILD_TIMESTAMP .
          docker build --file docker/mcp-http/Dockerfile --tag rateldesk-mcp-http:release-validation \
            --build-arg VERSION --build-arg SOURCE_REVISION_ID --build-arg BUILD_TIMESTAMP .
          tools/ci/smoke-web-static-assets.sh rateldesk-web:release-validation

      - name: Rehearse executable and deployment assets
        run: tools/release/package-assets.sh "${{ needs.metadata.outputs.version }}" "${{ needs.metadata.outputs.source_revision }}" release-assets

      - name: Verify executable asset checksums
        run: (cd release-assets && sha256sum --check SHA256SUMS)

      - name: Execute extracted Linux x64 archives
        run: tools/release/test-executable-archives.sh release-assets linux-x64

      - name: Test release asset upload semantics
        run: tools/release/test-publish-release-assets.sh

      - name: Transfer validated release payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/SHA256SUMS
            release-assets/release-manifest.json
            release-assets/release-manifest.json.sha256
          if-no-files-found: error

      - name: Start and smoke-test source Compose stack
        run: |
          docker compose -f docker/docker-compose.yml config --quiet
          docker compose -f docker/docker-compose.yml up --build --detach --wait
          curl --retry 6 --retry-all-errors --retry-delay 2 --fail --show-error --silent http://127.0.0.1:8222/health/live > /dev/null
          tools/ci/smoke-first-run-local.sh

      - name: Collect Compose logs
        if: always()
        run: docker compose -f docker/docker-compose.yml logs --no-color

      - name: Stop source Compose stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down --volumes --remove-orphans

  archive-runtime:
    name: Release archive runtime (${{ matrix.rid }})
    needs: validation
    if: ${{ !cancelled() && needs.validation.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: windows-latest
            rid: win-x64
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download the validated release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Extract and execute matching release archives
        shell: bash
        run: tools/release/test-executable-archives.sh release-assets "${{ matrix.rid }}"

  publish-web:
    name: Publish Web image
    needs: [metadata, validation]
    if: ${{ !cancelled() && needs.metadata.result == 'success' && needs.validation.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Preserve an existing immutable image tag on job recovery
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_IMAGE_NAME: rateldesk-web
        run: python3 tools/release/create-prerelease-tag.py check-images

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image tags and labels
        id: image
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/bostontechnologies/rateldesk-web
          tags: |
            type=raw,value=${{ needs.metadata.outputs.version }}
          labels: |
            org.opencontainers.image.title=RatelDesk Web
            org.opencontainers.image.description=RatelDesk web application
            org.opencontainers.image.source=https://github.com/BostonTechnologies/RatelDesk
            org.opencontainers.image.revision=${{ needs.metadata.outputs.source_revision }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.created=${{ needs.metadata.outputs.build_timestamp }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push multi-platform image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            SOURCE_REVISION_ID=${{ needs.metadata.outputs.source_revision }}
            BUILD_TIMESTAMP=${{ needs.metadata.outputs.build_timestamp }}
          provenance: mode=max
          sbom: true

  publish-api:
    name: Publish API image
    needs: [metadata, validation]
    if: ${{ !cancelled() && needs.metadata.result == 'success' && needs.validation.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Preserve an existing immutable image tag on job recovery
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_IMAGE_NAME: rateldesk-api
        run: python3 tools/release/create-prerelease-tag.py check-images

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image tags and labels
        id: image
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/bostontechnologies/rateldesk-api
          tags: |
            type=raw,value=${{ needs.metadata.outputs.version }}
          labels: |
            org.opencontainers.image.title=RatelDesk API
            org.opencontainers.image.description=RatelDesk API
            org.opencontainers.image.source=https://github.com/BostonTechnologies/RatelDesk
            org.opencontainers.image.revision=${{ needs.metadata.outputs.source_revision }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.created=${{ needs.metadata.outputs.build_timestamp }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push multi-platform image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            SOURCE_REVISION_ID=${{ needs.metadata.outputs.source_revision }}
            BUILD_TIMESTAMP=${{ needs.metadata.outputs.build_timestamp }}
          provenance: mode=max
          sbom: true

  publish-mcp-http:
    name: Publish HTTP MCP image
    needs: [metadata, validation]
    if: ${{ !cancelled() && needs.metadata.result == 'success' && needs.validation.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Preserve an existing immutable image tag on job recovery
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_IMAGE_NAME: rateldesk-mcp-http
        run: python3 tools/release/create-prerelease-tag.py check-images

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image tags and labels
        id: image
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/bostontechnologies/rateldesk-mcp-http
          tags: |
            type=raw,value=${{ needs.metadata.outputs.version }}
          labels: |
            org.opencontainers.image.title=RatelDesk HTTP MCP
            org.opencontainers.image.description=RatelDesk stateless HTTP MCP transport
            org.opencontainers.image.source=https://github.com/BostonTechnologies/RatelDesk
            org.opencontainers.image.revision=${{ needs.metadata.outputs.source_revision }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.created=${{ needs.metadata.outputs.build_timestamp }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push multi-platform image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/mcp-http/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            SOURCE_REVISION_ID=${{ needs.metadata.outputs.source_revision }}
            BUILD_TIMESTAMP=${{ needs.metadata.outputs.build_timestamp }}
          provenance: mode=max
          sbom: true

  release:
    name: Create GitHub Release
    needs: [metadata, validation, archive-runtime, publish-web, publish-api, publish-mcp-http]
    if: ${{ !cancelled() && needs.metadata.result == 'success' && needs.validation.result == 'success' && needs.archive-runtime.result == 'success' && needs.publish-web.result == 'success' && needs.publish-api.result == 'success' && needs.publish-mcp-http.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download the validated release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Verify public packages and anonymous pulls
        # A fresh Docker configuration proves the packages are anonymously
        # pullable. The GitHub Actions token cannot reliably read org package
        # metadata even with packages: read, so do not let that API limitation
        # weaken or block the actual public-access verification.
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          anonymous_docker_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_docker_config"' EXIT
          export DOCKER_CONFIG="$anonymous_docker_config"
          for image in rateldesk-web rateldesk-api rateldesk-mcp-http; do
            docker pull "ghcr.io/bostontechnologies/$image:$VERSION"
          done

      - name: Create draft release after images and payload are verified
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          SOURCE_REVISION: ${{ needs.metadata.outputs.source_revision }}
          BUILD_TIMESTAMP: ${{ needs.metadata.outputs.build_timestamp }}
          WEB_DIGEST: ${{ needs.publish-web.outputs.digest }}
          API_DIGEST: ${{ needs.publish-api.outputs.digest }}
          MCP_HTTP_DIGEST: ${{ needs.publish-mcp-http.outputs.digest }}
        run: |
          set -euo pipefail
          release_notes="RatelDesk $VERSION

          Containers

          ghcr.io/bostontechnologies/rateldesk-web:$VERSION
          ghcr.io/bostontechnologies/rateldesk-api:$VERSION
          ghcr.io/bostontechnologies/rateldesk-mcp-http:$VERSION

          Digests

          Web: $WEB_DIGEST
          API: $API_DIGEST
          HTTP MCP: $MCP_HTTP_DIGEST

          Source commit: $SOURCE_REVISION
          Built: $BUILD_TIMESTAMP

          Pull:
          docker pull ghcr.io/bostontechnologies/rateldesk-web:$VERSION
          docker pull ghcr.io/bostontechnologies/rateldesk-api:$VERSION
          docker pull ghcr.io/bostontechnologies/rateldesk-mcp-http:$VERSION"

          tools/release/prepare-release-manifest.sh \
            "$VERSION" "$SOURCE_REVISION" release-assets \
            "$WEB_DIGEST" "$API_DIGEST" "$MCP_HTTP_DIGEST" "$RELEASE_TAG"
          tools/release/publish-release-assets.sh "$RELEASE_TAG" "$VERSION" release-assets
          tools/release/update-release-metadata.sh \
            "$RELEASE_TAG" "$VERSION" "$PRERELEASE" "$release_notes"
