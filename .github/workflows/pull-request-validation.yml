name: Pull request validation

on:
  pull_request:
    branches: [dev, main]
    types:
      - opened
      - synchronize
      - reopened
      - converted_to_draft
      - ready_for_review
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-disclosure:
    name: Public disclosure gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repository validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Reject private references and secret-bearing files
        run: tools/ci/check-public-disclosure.sh

      - name: Scan for secrets
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/repo:ro"
          zricethezav/gitleaks:v8.30.1
          detect --no-git --source /repo --redact 100 --no-banner --verbose

  dotnet:
    name: .NET validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore NuGet packages cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore Helpdesk.sln

      - name: Build solution
        run: dotnet build Helpdesk.sln --configuration Release --no-restore

      - name: Run .NET tests
        run: >-
          dotnet test Helpdesk.sln --configuration Release --no-build
          --logger "trx;LogFileName=helpdesk-tests.trx"
          --results-directory TestResults

      - name: Upload .NET test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  ux:
    name: Playwright UX validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore NuGet packages cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore and build local applications
        run: |
          dotnet restore Helpdesk.sln
          dotnet build Helpdesk.sln --configuration Release --no-restore

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run local-only Playwright validation
        env:
          HELPDESK_E2E_AUTH_MODE: development
          PLAYWRIGHT_HTML_OUTPUT_DIR: artifacts/e2e/main-report
        run: tools/ci/run-ux-local.sh --output=artifacts/e2e/main-test-results

      - name: Run AI Assistant Playwright validation
        env:
          HELPDESK_AI_ASSISTANT_CONFIGURATION: Release
        run: npm run test:ux:ai-assistant

      - name: Upload Playwright reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
            artifacts/e2e
          if-no-files-found: warn
          retention-days: 14

  mailbox-lifecycle:
    name: Mailbox lifecycle acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore NuGet packages cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore application dependencies
        run: dotnet restore Helpdesk.sln

      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run published mailbox lifecycle acceptance
        run: bash tools/ci/run-mailbox-lifecycle.sh

      - name: Run published POP3 lifecycle without a global mailbox
        env:
          HELPDESK_MAILBOX_SPEC: tests/ux/mailbox-pop-lifecycle.spec.ts
        run: bash tools/ci/run-mailbox-lifecycle.sh

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mailbox-lifecycle-evidence
          path: artifacts/e2e/mailbox-lifecycle
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/api/Dockerfile
            image: helpdesk-api:pr-validation
          - name: web
            dockerfile: docker/web/Dockerfile
            image: helpdesk-web:pr-validation
          - name: mcp-http
            dockerfile: docker/mcp-http/Dockerfile
            image: helpdesk-mcp-http:pr-validation
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image without pushing
        run: docker build --file "${{ matrix.dockerfile }}" --tag "${{ matrix.image }}" .

      - name: Smoke-test published Blazor bootstrap asset
        if: matrix.name == 'web'
        run: tools/ci/smoke-web-static-assets.sh "${{ matrix.image }}"

      - name: Validate MCP Compose configuration ownership
        if: matrix.name == 'mcp-http'
        run: tools/ci/test-mcp-compose-config.sh "${{ matrix.image }}"

  release-assets:
    name: Release asset rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test stable-promotion validation helper without registry writes
        run: |
          python3 tools/release/test-validate-stable-promotion.py
          tools/release/test-promote-stable-images.sh

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Assemble self-contained CLI, stdio MCP, and deployment assets
        run: tools/release/package-assets.sh 0.0.0-pr "${{ github.sha }}" release-assets

      - name: Verify asset manifest and checksums
        run: |
          test "$(find release-assets -maxdepth 1 -name 'rateldesk-cli-*.tar.gz' | wc -l)" = 2
          test "$(find release-assets -maxdepth 1 -name 'rateldesk-cli-*.zip' | wc -l)" = 1
          test "$(find release-assets -maxdepth 1 -name 'rateldesk-mcp-stdio-*.tar.gz' | wc -l)" = 2
          test "$(find release-assets -maxdepth 1 -name 'rateldesk-mcp-stdio-*.zip' | wc -l)" = 1
          (cd release-assets && sha256sum --check SHA256SUMS)
          test -s release-assets/release-manifest.json

      - name: Render MCP Compose recipes from the extracted deployment archive
        run: tools/ci/test-deployment-archive-compose-config.sh release-assets/rateldesk-deployment-0.0.0-pr.tar.gz

      - name: Execute extracted Linux x64 archives
        run: tools/release/test-executable-archives.sh release-assets linux-x64

      - name: Test draft release asset upload semantics
        run: tools/release/test-publish-release-assets.sh

      - name: Upload release rehearsal assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-asset-rehearsal
          path: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/SHA256SUMS
            release-assets/release-manifest.json
            release-assets/release-manifest.json.sha256
          retention-days: 14

  archive-runtime:
    name: Release archive runtime (${{ matrix.rid }})
    needs: release-assets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: windows-latest
            rid: win-x64
    steps:
      - name: Check out archive validation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the validated release rehearsal payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-asset-rehearsal
          path: release-assets

      - name: Extract and execute matching release archives
        shell: bash
        run: tools/release/test-executable-archives.sh release-assets "${{ matrix.rid }}"

  compose:
    name: Compose startup validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate and start the documented local stack
        run: |
          docker compose -f docker/docker-compose.yml config --quiet
          docker compose -f docker/docker-compose.yml up --build --detach --wait
          curl --retry 6 --retry-all-errors --retry-delay 2 --fail --show-error --silent http://127.0.0.1:8222/health/live > /dev/null
          tools/ci/smoke-first-run-local.sh

      - name: Collect Compose logs
        if: always()
        run: docker compose -f docker/docker-compose.yml logs --no-color

      - name: Stop the local stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down --volumes --remove-orphans

  compose-postgres:
    name: Compose PostgreSQL setup validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RATELDESK_POSTGRES_PASSWORD: rateldesk-ci-postgres-password
      RATELDESK_SETUP_PROVIDER: PostgreSql
      RATELDESK_SETUP_POSTGRES_PASSWORD: rateldesk-ci-postgres-password
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate and start the documented PostgreSQL stack
        run: |
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.postgres.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.postgres.yml up --build --detach --wait
          curl --retry 6 --retry-all-errors --retry-delay 2 --fail --show-error --silent http://127.0.0.1:8222/health/live > /dev/null
          tools/ci/smoke-first-run-local.sh docker/docker-compose.yml docker/docker-compose.postgres.yml

      - name: Collect PostgreSQL Compose logs
        if: always()
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.postgres.yml logs --no-color

      - name: Stop the PostgreSQL stack
        if: always()
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.postgres.yml down --volumes --remove-orphans

  compose-external-postgres-config:
    name: External PostgreSQL Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RATELDESK_VERSION: 0.0.0-ci
      RATELDESK_POSTGRES_CONNECTION_STRING: Host=postgres.example.test;Port=5432;Database=rateldesk;Username=rateldesk;Password=ci-placeholder;Ssl Mode=Require
      RATELDESK_BOOTSTRAP_ADMIN_EMAIL: admin@example.test
      RATELDESK_BOOTSTRAP_ADMIN_DISPLAY_NAME: Initial Administrator
      RATELDESK_BOOTSTRAP_ADMIN_PASSWORD: ci-placeholder-long-passphrase
      RATELDESK_BOOTSTRAP_ORGANIZATION_NAME: Example Organization
      RATELDESK_BOOTSTRAP_APPLICATION_URL: http://localhost:8111
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the documented external PostgreSQL source recipe
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.external-postgres.yml config --quiet

      - name: Validate the documented external PostgreSQL release recipe
        run: docker compose -f docker/docker-compose.release.yml -f docker/docker-compose.external-postgres.yml config --quiet

  layout:
    name: Layout and reference validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install repository validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Validate repository layout and active path references
        run: tools/ci/validate-layout.sh
