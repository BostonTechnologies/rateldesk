name: rateldesk

# Optional image-only equivalent; MCP has no published host port by default.
services:
  api:
    environment:
      IntegrationCredentials__Pairing__PublicOrigin: ${RATELDESK_PUBLIC_ORIGIN:?Set the trusted public HTTPS origin.}
  web:
    environment:
      WebGateway__PublicOrigin: ${RATELDESK_PUBLIC_ORIGIN:?Set the trusted public HTTPS origin.}
      WebGateway__Mcp__Enabled: "true"
      WebGateway__Mcp__Destination: ${RATELDESK_MCP_DESTINATION:-http://mcp-http:8223/}
      WebGateway__Mcp__AuthenticationMode: gateway
  mcp-http:
    logging:
      driver: json-file
      options:
        max-size: "${RATELDESK_DOCKER_LOG_MAX_SIZE:-200m}"
        max-file: "${RATELDESK_DOCKER_LOG_MAX_FILE:-5}"
    image: ghcr.io/bostontechnologies/rateldesk-mcp-http:${RATELDESK_VERSION:?Select an exact published version.}
    labels:
      com.rateldesk.deployment.manager: release-compose
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RatelDesk__Logging__MinimumLevel: ${RATELDESK_LOG_MINIMUM_LEVEL:-Warning}
      Helpdesk__Mcp__Instance: ${RATELDESK_MCP_INSTANCE:-local}
      Helpdesk__Mcp__ExpectedApiBaseUrl: ${RATELDESK_MCP_API_BASE_URL:-http://api:8222/}
      Helpdesk__Mcp__Outbound__ApiBaseUrl: ${RATELDESK_MCP_API_BASE_URL:-http://api:8222/}
      Helpdesk__Mcp__Outbound__CredentialMode: gateway
      Helpdesk__Mcp__PublicResourceUri: ${RATELDESK_PUBLIC_ORIGIN:?Set the trusted public HTTPS origin.}/mcp
      Helpdesk__Mcp__AllowedOrigins__0: ${RATELDESK_PUBLIC_ORIGIN:?Set the trusted public HTTPS origin.}
      Helpdesk__Mcp__AuthenticationMode: gateway
    depends_on:
      api:
        condition: service_healthy
