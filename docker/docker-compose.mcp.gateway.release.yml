name: rateldesk

# Optional local image-only gateway overlay; use with docker-compose.release.yml.
services:
  web:
    environment:
      WebGateway__PublicOrigin: ${RATELDESK_PUBLIC_ORIGIN:-}
      WebGateway__Mcp__PublicResourceUri: ${RATELDESK_MCP_PUBLIC_RESOURCE_URI:?Set the canonical public HTTPS MCP resource.}
      WebGateway__Mcp__Enabled: "true"
      WebGateway__Mcp__Destination: ${RATELDESK_MCP_DESTINATION:-http://mcp-http:8223/}
      WebGateway__Mcp__AuthenticationMode: gateway

  mcp-config-init:
    image: ghcr.io/bostontechnologies/rateldesk-mcp-http:${RATELDESK_VERSION:?Set RATELDESK_VERSION to an exact published version.}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mkdir -p /run/rateldesk-mcp && cp /input/config.json /run/rateldesk-mcp/config.json &&
        chown 10001:10001 /run/rateldesk-mcp/config.json && chmod 0400 /run/rateldesk-mcp/config.json
    volumes:
      - type: bind
        source: ${RATELDESK_MCP_CONFIG_FILE:?Set RATELDESK_MCP_CONFIG_FILE to a gateway configuration file.}
        target: /input/config.json
        read_only: true
      - mcp-http-config:/run/rateldesk-mcp

  mcp-http:
    image: ghcr.io/bostontechnologies/rateldesk-mcp-http:${RATELDESK_VERSION:?Set RATELDESK_VERSION to an exact published version.}
    labels:
      com.rateldesk.deployment.manager: release-compose
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RATELDESK_MCP_CONFIG: /run/rateldesk-mcp/config.json
      Helpdesk__Mcp__Instance: ${RATELDESK_MCP_INSTANCE:-local}
      Helpdesk__Mcp__ExpectedApiBaseUrl: http://api:8222/
      Helpdesk__Mcp__PublicResourceUri: ${RATELDESK_MCP_PUBLIC_RESOURCE_URI:?Set the canonical public HTTPS MCP URL, for example https://mcp.example.test/mcp.}
      Helpdesk__Mcp__AllowedOrigins__0: ${RATELDESK_MCP_ALLOWED_ORIGIN:?Set the browser origin allowed to call this MCP endpoint.}
      Helpdesk__Mcp__AuthenticationMode: gateway
    volumes:
      - mcp-http-config:/run/rateldesk-mcp:ro
    depends_on:
      api:
        condition: service_healthy
      mcp-config-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${RATELDESK_MCP_PORT:-8223}:8223"

volumes:
  mcp-http-config:
