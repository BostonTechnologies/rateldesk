services:
  postgres:
    logging:
      driver: json-file
      options:
        max-size: "${RATELDESK_DOCKER_LOG_MAX_SIZE:-200m}"
        max-file: "${RATELDESK_DOCKER_LOG_MAX_FILE:-5}"
    image: postgres:16
    environment:
      POSTGRES_DB: rateldesk
      POSTGRES_USER: rateldesk
      POSTGRES_PASSWORD: rateldesk
    ports:
      - "127.0.0.1:${RATELDESK_POSTGRES_PORT:-55432}:5432"
    volumes:
      - rateldesk-e2e-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rateldesk -d rateldesk"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rateldesk-e2e-postgres-data:
