name: rateldesk

services:
  api:
    restart: unless-stopped
    image: ghcr.io/bostontechnologies/rateldesk-api:${RATELDESK_VERSION:?Set RATELDESK_VERSION to an exact published RatelDesk version.}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Authentication__Mode: Local
      Authentication__AllowInsecureLocalhost: "true"
      DataProtection__KeyRingPath: /var/lib/rateldesk/keys
      Bootstrap__StateDirectory: /var/lib/rateldesk/bootstrap
      Bootstrap__DataDirectory: /var/lib/rateldesk/data
      StorageOptions__RootPath: /app/storage
    ports:
      - "127.0.0.1:${RATELDESK_API_PORT:-8222}:8222"
    volumes:
      - rateldesk-data-protection:/var/lib/rateldesk/keys
      - rateldesk-bootstrap:/var/lib/rateldesk/bootstrap
      - rateldesk-data:/var/lib/rateldesk/data
      - rateldesk-storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    restart: unless-stopped
    image: ghcr.io/bostontechnologies/rateldesk-web:${RATELDESK_VERSION:?Set RATELDESK_VERSION to an exact published RatelDesk version.}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApiBaseUrl: http://api:8222/
      DataProtection__KeyRingPath: /var/lib/rateldesk/keys
      Authentication__Mode: Local
      Authentication__AllowInsecureLocalhost: "true"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RATELDESK_WEB_PORT:-8111}:8111"
    volumes:
      - rateldesk-data-protection:/var/lib/rateldesk/keys

volumes:
  rateldesk-data-protection:
  rateldesk-bootstrap:
  rateldesk-data:
  rateldesk-storage:
